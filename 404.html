<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Página no encontrada | Pigeon Shot VR</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
*{ margin:0; padding:0; box-sizing:border-box; }

body{
    font-family:'Orbitron', sans-serif;
    background:#000;
    color:#39ff88;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

/* LÍNEAS DE ESCANEO */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events:none;
    z-index:1;
}

/* RESPLANDOR DE FONDO */
.noise{
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 50%, rgba(57,255,136,0.07), transparent 65%);
    pointer-events:none;
    z-index:0;
}

.terminal{
    position:relative;
    z-index:2;
    max-width:620px;
    margin:20px;
    padding:44px 48px;
    border:1px solid rgba(57,255,136,0.35);
    border-radius:6px;
    background:rgba(0,12,6,0.80);
    box-shadow:0 0 40px rgba(57,255,136,0.12), inset 0 0 30px rgba(0,0,0,0.4);
    animation:fadeIn .5s ease;
}

.terminal::before{
    content:"pigeon-shot-vr ~ %";
    display:block;
    color:rgba(57,255,136,0.45);
    font-size:0.75rem;
    margin-bottom:24px;
    letter-spacing:1px;
}

.terminal h1{
    font-size:2.5rem;
    margin-bottom:22px;
    letter-spacing:2px;
}

.errorcode{
    color:#ff3860;
    text-shadow:0 0 14px rgba(255,56,96,0.8);
}

.output{
    margin:10px 0;
    color:#9effc4;
    line-height:1.7;
    font-size:0.9rem;
}

.output a{
    color:#39ff88;
    text-underline-offset:3px;
}

.output a:hover{
    text-shadow:0 0 8px #39ff88;
}

.cursor{
    display:inline-block;
    width:10px;
    height:1.1em;
    background:#39ff88;
    margin-left:4px;
    vertical-align:middle;
    animation:blink .8s step-end infinite;
}

@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes fadeIn{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>

<body>

<div class="noise"></div>

<div class="terminal">
    <h1>Error <span class="errorcode">404</span></h1>

    <p class="output">La página que buscas fue eliminada, cambió de nombre o no está disponible temporalmente.</p>

    <p class="output">
        Intenta <a href="javascript:history.back()">volver atrás</a>
        o <a href="index.html">regresar al inicio</a>.
    </p>

    <p class="output">Buena suerte, cazador. <span class="cursor"></span></p>
</div>

</body>
</html>
