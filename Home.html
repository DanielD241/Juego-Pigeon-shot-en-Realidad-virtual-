<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigeon Shot VR</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron', sans-serif;
    background:#050505;
    color:white;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    padding:20px 8%;
    background:rgba(0,0,0,0.7);
    position:sticky;
    top:0;
}

.logo{
    color:#00c6ff;
    font-size:1.5rem;
}

/* HERO */
.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:3rem;
    color:#00c6ff;
}

.hero p{
    max-width:700px;
    margin:20px auto;
    color:#ccc;
}

.hero img{
    width:100%;
    max-width:900px;
    border-radius:20px;
    margin-top:20px;
}

/* BOTÓN DESCARGA */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:15px 30px;
    background:#00c6ff;
    color:black;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

/* GALERÍA */
.section{
    padding:70px 20px;
}

.section h2{
    text-align:center;
    color:#00c6ff;
    margin-bottom:30px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
    gap:20px;
    padding:0 20px;
}

.gallery img{
    width:100%;
    border-radius:15px;
}

/* FORMULARIO */
.form-section{
    padding:70px 20px;
    text-align:center;
}

.form-box{
    max-width:400px;
    margin:auto;
    background:rgba(255,255,255,0.08);
    padding:30px;
    border-radius:15px;
}

.form-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

.form-box button{
    width:100%;
    padding:12px;
    background:#00c6ff;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    color:#777;
}
</style>
</head>

<body>

<header>
    <div class="logo">Pigeon Shot VR</div>
</header>

<!-- PORTADA -->
<section class="hero">
    <h1>PIGEON SHOT VR</h1>
    <p>
        Un juego de realidad virtual donde proteges tus cultivos de trigo
        de las palomas invasoras. Vive la experiencia de disparo VR.
    </p>

    <img src="imagenes/Portada-Pigeon-shot.jpeg" alt="Portada">

    <br>

    <!-- DESCARGA APK -->
    <a href="PigeonShot.apk" download class="btn">
        Descargar APK
    </a>
</section>

<!-- GALERÍA -->
<section class="section">
    <h2>GALERÍA DEL JUEGO</h2>

    <div class="gallery">
        <img src="imagenes/cazador-trigo 1.jpeg">
        <img src="imagenes/cazador-trigo 2.jpeg">
    </div>
</section>

<!-- FORMULARIO -->
<section class="form-section">
    <h2 style="color:#00c6ff;">Regístrate para jugar</h2>

    <div class="form-box">
        <input type="text" placeholder="Usuario">
        <input type="email" placeholder="Correo">
        <input type="password" placeholder="Contraseña">

        <button onclick="alert('Registro simulado')">
            Crear cuenta
        </button>
    </div>
</section>

<footer>
    © 2026 Pigeon Shot VR - Todos los derechos reservados
</footer>

</body>
</html>
