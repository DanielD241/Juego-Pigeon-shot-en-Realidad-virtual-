<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigeon Shot VR | Shooter VR Arcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron', sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at top, rgba(0,198,255,0.15), transparent 40%),
    radial-gradient(circle at bottom, rgba(255,0,150,0.12), transparent 40%);
    z-index:-1;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:rgba(0,0,0,0.5);
    position:sticky;
    top:0;
}

.logo{
    color:#00c6ff;
    font-size:1.5rem;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:3rem;
    color:#00c6ff;
}

.hero p{
    color:#ccc;
    margin:20px 0;
}

.hero-image{
    width:100%;
    max-width:800px;
    border-radius:20px;
    margin-top:20px;
}

.section{
    padding:80px 20px;
}

.section-title{
    text-align:center;
    color:#00c6ff;
    font-size:2rem;
    margin-bottom:40px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    border-radius:15px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Pigeon Shot VR</div>
    <nav>
        <a href="#galeria">Galería</a>
    </nav>
</header>

<section class="hero">
    <h1>PIGEON SHOT VR</h1>
    <p>Protege tus cultivos de trigo de las palomas invasoras en realidad virtual</p>

    <!-- PORTADA -->
    <img src="imagenes/Portada-Pigeon-shot.jpeg"
         alt="Portada del juego"
         class="hero-image">
</section>

<section class="section" id="galeria">
    <h2 class="section-title">GALERÍA</h2>

    <div class="gallery">
        <!-- IMÁGENES CAZADOR -->
        <img src="imagenes/cazador-trigo 1.jpeg" alt="Imagen 1">
        <img src="imagenes/cazador-trigo 2.jpeg" alt="Imagen 2">
    </div>
</section>

</body>
</html>
