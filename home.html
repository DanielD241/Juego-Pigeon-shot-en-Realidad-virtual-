<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigeon Shot VR | Shooter VR Arcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron', sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at top, rgba(0,198,255,0.15), transparent 40%),
    radial-gradient(circle at bottom, rgba(255,0,150,0.12), transparent 40%);
    z-index:-1;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    backdrop-filter:blur(10px);
    background:rgba(0,0,0,0.5);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:1.5rem;
    color:#00c6ff;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.hero h1{
    font-size:5rem;
    color:#00c6ff;
    margin-bottom:20px;
}

.hero p{
    max-width:700px;
    color:#ccc;
    margin-bottom:30px;
    line-height:1.8;
}

.hero-image{
    width:100%;
    max-width:900px;
    border-radius:20px;
    margin-bottom:40px;
}

.btn{
    display:inline-block;
    padding:15px 35px;
    border-radius:12px;
    background:#00c6ff;
    color:black;
    text-decoration:none;
    font-weight:bold;
}

.section{
    padding:100px 8%;
}

.section-title{
    text-align:center;
    font-size:2.8rem;
    margin-bottom:60px;
    color:#00c6ff;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.gallery img{
    width:100%;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,198,255,0.25);
}

footer{
    padding:40px;
    text-align:center;
    color:#777;
}
</style>
</head>
<body>

<header>
    <div class="logo">Pigeon Shot VR</div>
    <nav>
        <a href="#galeria">Galería</a>
        <a href="#descarga">Descargar</a>
    </nav>
</header>

<section class="hero">
    <h1>PIGEON SHOT VR</h1>
    <p>
        Protege tus cultivos de trigo de las palomas invasoras
        en una experiencia de realidad virtual.
    </p>

    <!-- Imagen principal -->
    <img src="imagenes/Portada-Pigeob-shit.jpeg"
         alt="Portada del juego"
         class="hero-image">

    <a href="#descarga" class="btn">DESCARGAR APK</a>
</section>

<section class="section" id="galeria">
    <h2 class="section-title">GALERÍA</h2>

    <div class="gallery">
        <!-- Imagen 1 -->
        <img src="imagenes/cazador-trigo-1.jpeg"
             alt="Cazador protegiendo el cultivo">

        <!-- Imagen 2 -->
        <img src="imagenes/cazador-trigo-2.jpeg"
             alt="Cazador disparando a las palomas">

        <!-- Imagen 3 -->
        <img src="imagenes/cazador-trigo-3.jpeg"
             alt="Vista del juego en realidad virtual">
    </div>
</section>

<section class="section" id="descarga">
    <h2 class="section-title">DESCARGA</h2>

    <div style="text-align:center;">
        <a href="PigeonShot.apk" download class="btn">
            Descargar APK
        </a>
    </div>
</section>

<footer>
    © 2026 Pigeon Shot VR — Todos los derechos reservados
</footer>

</body>
</html>
