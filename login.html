<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigeon Shot VR - Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: url("imagenes/Portada-Pigeon-shot.jpeg") center/cover no-repeat;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
}

.login-box{
    position:relative;
    z-index:1;
    width:420px;
    max-width:90%;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    box-shadow:0 8px 40px rgba(0,0,0,0.4);
    color:white;
    text-align:center;
}

.login-box h1{
    color:#00c6ff;
    margin-bottom:10px;
}

.login-box p{
    color:#ddd;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-family:'Orbitron', sans-serif;
}

.login-box input::placeholder{
    color:#ddd;
}

.login-box button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    font-family:'Orbitron', sans-serif;
}

.btn-register{
    background:#00c6ff;
    color:black;
}

.btn-login{
    background:transparent;
    border:2px solid #00c6ff;
    color:white;
}

.login-box button:hover{
    transform:scale(1.03);
}
</style>
</head>

<body>

<div class="login-box">
    <h1>PIGEON SHOT VR</h1>
    <p>Regístrate o inicia sesión</p>

    <form method="POST" autocomplete="off">

        <!-- Usuario -->
        <input
            type="text"
            name="usuario"
            placeholder="Usuario"
            required
        >

        <!-- Correo -->
        <input
            type="email"
            name="correo"
            placeholder="Correo"
            required
        >

        <!-- Contraseña -->
        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required
            autocomplete="off"
        >

        <!-- Botón Registrarse -->
        <button
            type="submit"
            formaction="registrar.php"
            class="btn-register"
        >
            Registrarse
        </button>

        <!-- Botón Iniciar Sesión -->
        <button
            type="submit"
            formaction="login.php"
            class="btn-login"
        >
            Iniciar Sesión
        </button>

    </form>
</div>

</body>
</html>
