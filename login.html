<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigeon Shot VR - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Override para fondo de imagen en esta página */
body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(rgba(0,0,0,0.68), rgba(0,0,0,0.68)),
        url("imagenes/Portada-pigeon-shot.jpeg") center/cover no-repeat fixed;
}

/* Tabs de modo */
.tabs{
    display:flex;
    gap:0;
    margin-bottom:22px;
    border-radius:10px;
    overflow:hidden;
    border:2px solid var(--accent);
}

.tab{
    flex:1;
    padding:12px;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--font);
    font-size:0.85rem;
    font-weight:bold;
    cursor:pointer;
    border:none;
    transition:0.2s;
}

.tab.active{
    background:var(--accent);
    color:#000;
}

/* Campo usuario se oculta en modo login */
.field-usuario{
    overflow:hidden;
    max-height:80px;
    transition:max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
    opacity:1;
}

.field-usuario.hidden{
    max-height:0;
    opacity:0;
    margin:0;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>PIGEON SHOT VR</h1>
    <p id="subtitle">Crea tu cuenta para jugar</p>

    <!-- TABS MODO -->
    <div class="tabs">
        <button class="tab active" onclick="setMode('registro')">Registrarse</button>
        <button class="tab"        onclick="setMode('login')">Iniciar Sesión</button>
    </div>

    <!-- FORMULARIO ÚNICO -->
    <form id="mainForm" method="POST" autocomplete="on">

        <!-- USUARIO (solo para registro) -->
        <div class="field-usuario" id="fieldUsuario">
            <input
                type="text"
                id="inputUsuario"
                name="usuario"
                placeholder="Usuario (3–20 caracteres)"
                minlength="3"
                maxlength="20"
                autocomplete="username"
                required
            >
        </div>

        <!-- CORREO -->
        <input
            type="email"
            name="correo"
            placeholder="Correo Gmail"
            pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"
            title="Ingresa un correo Gmail válido"
            autocomplete="email"
            required
        >

        <!-- CONTRASEÑA -->
        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            minlength="8"
            autocomplete="current-password"
            required
        >

        <!-- BOTÓN DE ACCIÓN -->
        <button type="submit" id="submitBtn" formaction="registrar.php" class="btn-register">
            Registrarse
        </button>

    </form>

    <div class="info" id="infoText">
        Usa un correo Gmail. Contraseña: mínimo 8 caracteres, una mayúscula y un número.
    </div>

</div>

<script>
/* =========================
   TOGGLE REGISTRO / LOGIN
   ========================= */

function setMode(mode){
    const tabs     = document.querySelectorAll('.tab');
    const fieldUs  = document.getElementById('fieldUsuario');
    const inputUs  = document.getElementById('inputUsuario');
    const btn      = document.getElementById('submitBtn');
    const subtitle = document.getElementById('subtitle');
    const info     = document.getElementById('infoText');

    if(mode === 'login'){
        // Activar tab Login
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');

        // Ocultar campo usuario y quitar required
        fieldUs.classList.add('hidden');
        inputUs.removeAttribute('required');

        // Cambiar botón
        btn.textContent  = 'Iniciar Sesión';
        btn.className    = 'btn-login';
        btn.setAttribute('formaction', 'login.php');

        subtitle.textContent = 'Bienvenido de vuelta';
        info.textContent     = 'Ingresa tu correo Gmail y contraseña.';

    } else {
        // Activar tab Registro
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');

        // Mostrar campo usuario y restaurar required
        fieldUs.classList.remove('hidden');
        inputUs.setAttribute('required', '');

        // Cambiar botón
        btn.textContent = 'Registrarse';
        btn.className   = 'btn-register';
        btn.setAttribute('formaction', 'registrar.php');

        subtitle.textContent = 'Crea tu cuenta para jugar';
        info.textContent     = 'Usa Gmail. Contraseña: mínimo 8 caracteres, mayúscula y número.';
    }
}
</script>

</body>
</html>
